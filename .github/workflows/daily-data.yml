name: Daily market data
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      update_data:
        description: Fetch official market data before publishing
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-market-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run data:update -- --strict
        if: github.event_name == 'schedule' || inputs.update_data == true
      - run: npm run data:validate
      - run: npm test
      - run: npm run build
      - run: npm run test:build
      - name: Commit verified data snapshot
        run: |
          git config user.name 'market-radar-bot'
          git config user.email 'market-radar-bot@users.noreply.github.com'
          git add public/data/history.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update verified market history'
            git push
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - name: Deploy verified dashboard
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      # Artifact registration is eventually consistent. Retry once after a
      # bounded delay; a second failure fails the job and preserves the live site.
      - name: Wait for Pages artifact registration after a failed attempt
        if: steps.deployment.outcome == 'failure'
        run: sleep 10
      - name: Retry Pages deployment
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      # Keep source evidence separate until the website artifact is deployed.
      - name: Archive source evidence and run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data-evidence-${{ github.run_id }}
          path: |
            data/raw
            data/runs
          retention-days: 90
          if-no-files-found: ignore
