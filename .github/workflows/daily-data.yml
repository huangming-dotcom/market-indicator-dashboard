name: Daily market data
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-market-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run data:update -- --strict
      - run: npm run data:validate
      - run: npm test
      - run: npm run build
      - name: Commit verified data snapshot
        run: |
          git config user.name 'market-radar-bot'
          git config user.email 'market-radar-bot@users.noreply.github.com'
          git add public/data/history.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update verified market history'
            git push
          fi
      - name: Archive source evidence and run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data-evidence-${{ github.run_id }}
          path: |
            data/raw
            data/runs
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dist
